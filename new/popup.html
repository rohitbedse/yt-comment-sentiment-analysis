<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>YouTube Comment Analyzer-1</title>
  <style>
    /* Modern Dark Theme */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #e4e4e7;
      width: 420px;
      max-height: 600px;
      overflow-y: auto;
    }

    /* Custom Scrollbar */
    body::-webkit-scrollbar {
      width: 8px;
    }

    body::-webkit-scrollbar-track {
      background: #1a1a2e;
    }

    body::-webkit-scrollbar-thumb {
      background: #3b82f6;
      border-radius: 4px;
    }

    body::-webkit-scrollbar-thumb:hover {
      background: #2563eb;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      padding: 20px;
      text-align: center;
      border-bottom: 3px solid #1d4ed8;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .header-icon {
      width: 28px;
      height: 28px;
      background: #ffffff;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #3b82f6;
      font-weight: bold;
    }

    .header-subtitle {
      font-size: 12px;
      color: #bfdbfe;
      font-weight: 400;
    }

    /* Content */
    .content {
      padding: 16px;
    }

    /* Loading State */
    .loading {
      text-align: center;
      padding: 30px;
      color: #94a3b8;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #334155;
      border-top: 4px solid #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Video Info */
    .video-info {
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .video-icon {
      width: 40px;
      height: 40px;
      background: #3b82f6;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .video-details {
      flex: 1;
    }

    .video-id {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 4px;
    }

    .video-status {
      font-size: 13px;
      color: #e4e4e7;
      font-weight: 500;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat-card {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 14px;
      text-align: center;
      transition: all 0.3s ease;
    }

    .stat-card:hover {
      transform: translateY(-2px);
      border-color: #3b82f6;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
    }

    .stat-label {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
    }

    .stat-value.score {
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Section */
    .section {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: #3b82f6;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::before {
      content: '';
      width: 4px;
      height: 18px;
      background: linear-gradient(180deg, #3b82f6 0%, #2563eb 100%);
      border-radius: 2px;
    }

    /* Chart Container */
    .chart-container, .wordcloud-container, .trend-container {
      background: #0f172a;
      border-radius: 8px;
      padding: 12px;
      margin-top: 10px;
    }

    .chart-container img, .wordcloud-container img, .trend-container img {
      width: 100%;
      border-radius: 6px;
    }

    /* Comments List */
    .comment-list {
      list-style: none;
      max-height: 400px;
      overflow-y: auto;
    }

    .comment-list::-webkit-scrollbar {
      width: 6px;
    }

    .comment-list::-webkit-scrollbar-track {
      background: #0f172a;
      border-radius: 3px;
    }

    .comment-list::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 3px;
    }

    .comment-item {
      background: #0f172a;
      border-left: 3px solid #334155;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 10px;
      transition: all 0.2s ease;
    }

    .comment-item:hover {
      border-left-color: #3b82f6;
      transform: translateX(4px);
    }

    .comment-number {
      display: inline-block;
      background: #3b82f6;
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      margin-right: 6px;
    }

    .comment-text {
      color: #cbd5e1;
      font-size: 13px;
      line-height: 1.5;
      margin-top: 6px;
    }

    .comment-sentiment {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .sentiment-positive {
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .sentiment-neutral {
      background: rgba(148, 163, 184, 0.2);
      color: #94a3b8;
      border: 1px solid rgba(148, 163, 184, 0.3);
    }

    .sentiment-negative {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    /* Error State */
    .error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      padding: 16px;
      color: #fca5a5;
      text-align: center;
    }

    /* Info Message */
    .info-message {
      text-align: center;
      padding: 30px 20px;
      color: #94a3b8;
    }

    .info-icon {
      font-size: 48px;
      margin-bottom: 12px;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>
      <span class="header-icon">📊</span>
      CommentAnalyzer
    </h1>
    <div class="header-subtitle">YouTube Sentiment Analysis</div>
  </div>

  <div class="content">
    <div id="output"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
